# Each test app (Spring starts one per distinct test setup) gets its own in-memory database.
# LOCK_TIMEOUT: the concurrency test makes requests wait on each other's cart lock.
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

project.image=images/
frontend.url=http://localhost:5173/
image.base.url=http://localhost:8080/images
spring.app.jwtSecret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
spring.app.jwtExpirationMs=300000000
spring.ecom.app.jwtCookieName=springBootEcom
stripe.secret.key=test-stripe-secret-key
app.seed.admin-password=adminPass
app.seed.sample-users=true
app.demo.enabled=false
app.demo.admin-username=demo-admin
app.demo.admin-password=demo-admin
