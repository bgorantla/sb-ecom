spring.application.name=sb-ecom

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#spring.h2.console.enabled=true
#spring.datasource.url=jdbc:h2:mem:test

project.image=images/
# Product photo uploads (Spring's default limit is 1 MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true


spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=300000000
spring.ecom.app.jwtCookieName=springBootEcom



#logging.level.org.springframework=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.springframework.security=DEBUG
#logging.level.com.ecommerce.project=DEBUG


# Needed if you are using elastic beanstalk
#server.port=5000
frontend.url=${FRONTEND_URL:http://localhost:5173}
image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images}

#STRIPE KEY
stripe.secret.key=${STRIPE_SECRET_KEY}
# Signing secret of the Stripe webhook (whsec_...). Empty turns the webhook endpoint off.
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
# Leave empty for the real Stripe; set it only to test against a fake Stripe server
stripe.api-base=${STRIPE_API_BASE:}

# Accounts created on startup (see WebSecurityConfig.initData)
# admin's password is only used the first time the account is created.
app.seed.admin-password=${ADMIN_PASSWORD:adminPass}
# user1/password1 and seller1/password2: handy locally, turned off on the server
app.seed.sample-users=${SEED_SAMPLE_USERS:true}

# Public demo mode: a read-only demo admin and the test-mode banner (see the demo package)
app.demo.enabled=${DEMO_MODE:false}
app.demo.admin-username=demo-admin
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:demo-admin}
