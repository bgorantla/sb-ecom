# Nginx site for sb-ecom: serves the React build and proxies the Spring Boot API.
# The browser sees a single origin, so the JWT cookie and CORS work without code changes.

# CloudFront talks to this server over plain HTTP. If it says the visitor
# actually used HTTPS, pass that on to Spring (used for Swagger's server URL).
map $http_cloudfront_forwarded_proto $forwarded_proto {
    default $http_cloudfront_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/sb-ecom;
    index index.html;

    # Product image uploads
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Spring Boot: REST API, uploaded product images, Swagger UI
    location ~ ^/(api|images|swagger-ui|v3/api-docs)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Vite's hashed build files never change, so browsers can keep them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the React app; unknown paths go to index.html for React Router
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
